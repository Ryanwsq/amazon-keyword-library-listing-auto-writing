skill:
  name: amazon-keyword-sif-competitor-collection
  maturity: draft
  last_verified: null
capabilities:
  - id: keyword.source.competitor-traffic.web-query
    type: manual
    purpose: 通过长期副任务内置浏览器中的已登录SIF官网，首选执行直接竞品最近30天查询和完整官方导出
    status: planned
    input: Amazon-US或Amazon-DE锁、匹配的提供商站点参数、输入表中的非敏感账户别名/凭据引用/登录方式、本Task/host对应keyword:sif-collector:sif的会话回执、获准ASIN、最近30天口径、300条上限和证据目录
    output: 登录/查询条件、页面或导出原始证据、结果顺序、七列业务字段、ASIN选择人口、数量闭环和入口状态
    permission: approved-read
    risk: 查询前必须验证登录与站点一致；未登录只回传awaiting_login，站点不符回传marketplace_mismatch并等待用户介入；不得直接发问、切US或擅自切MCP
  - id: keyword.source.sif.persist-and-verify
    type: manual
    purpose: 在解析前保存每次SIF完整响应，再装配七列关键词明细和核心词候选摘要
    status: planned
    input: 单次SIF返回、请求参数、Run_ID、本机忽略目录和抓取时间
    output: 版本化原始响应、七列明细工作簿、不执行语义晋级的核心词候选摘要、来源清单、行数核对、哈希、异常和紧凑主任务回传
    permission: local-draft
    risk: 不覆盖旧响应；原始返回未落盘时不得继续汇总；主任务消息不得展开原始长响应
  - id: keyword.source.competitor-traffic.query
    type: mcp
    purpose: 仅在用户明确表示当前设备或会话无法完成SIF网页登录时，通过同提供商SIF适配器备用反查直接竞品ASIN最近30天流量关键词
    status: planned
    input: 站点、单个获准直接竞品ASIN、最近30天口径和300条接口上限请求
    output: 单个竞品的完整原始响应、流量关键词、周期和查询状态；接口本身不支持字段选择
    permission: approved-read
    risk: 未满足用户明确确认门不得执行；不替换失败ASIN；不把接口上限称为Amazon全量；结构冲突时停止
