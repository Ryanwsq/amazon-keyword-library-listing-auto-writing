skill:
  name: amazon-keyword-classification
  maturity: draft
  last_verified: null

capabilities:
  - id: keyword.library.classify
    type: manual
    purpose: 协调Sheet2动态语义与流量分类、Sheet4流量分类和五列否词库
    status: planned
    input: 锁定的Sheet2/3/4、Keyword_ID、ABA、品类关系、通用词库资格、站点、周期和分类版本
    output: 两Sheet分类过程工作簿、否词库、manifest和质检结果
    permission: local-draft-and-verify
    risk: 不读取SKU事实卡；不改变三去向；不生成广告或竞争趋势判断
  - id: keyword.classification.sheet2.apply
    type: manual
    purpose: 为Sheet2追加F1至F5、F5唯一主分组、LT和品类自适应动态语义列
    status: planned
    input: Sheet2十四列人口和当前品类语义
    output: 十四列加四固定列加N动态语义列的Sheet2
    permission: local-draft
    risk: ABA缺失不伪造层；动态列必须非空且仅由词面支持；品类关系和通用词库资格不得改写
  - id: keyword.classification.sheet4.apply
    type: manual
    purpose: 为Sheet4二类词只追加流量层、主分组、LT和分类状态
    status: planned
    input: Sheet4十二列人口和ABA
    output: 十二列加四固定列的Sheet4
    permission: local-draft
    risk: 不重判二类身份；不加完整语义列、竞争或趋势
  - id: keyword.classification.negative-library.build
    type: manual
    purpose: 从语义明确且已复核Sheet3行生成五列最小否词库
    status: planned
    input: Sheet3摘除类型、理由和人工复核状态
    output: Keyword_ID、英文词、翻译、否词类别和收录理由
    permission: local-draft
    risk: 不输出精准或词组否定；流量失败、歧义和待复核词不自动收录
  - id: keyword.classification.outputs.write-and-verify
    type: manual
    purpose: 验证分类与否词输出的人口、主键、动态列、LT和禁止字段
    status: planned
    input: 分类结果、否词结果、上游哈希和版本
    output: 工作簿、manifest、渲染和异常摘要
    permission: local-draft-and-verify
    risk: 主键或人口不闭合时阻断
