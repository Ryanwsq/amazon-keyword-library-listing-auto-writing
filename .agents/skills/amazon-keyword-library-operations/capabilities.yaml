skill:
  name: amazon-keyword-library-operations
  maturity: draft
  last_verified: null

capabilities:
  - id: keyword.runtime.dispatch.guard
    type: cli
    purpose: 机械生成派发身份、事务去重、接收端当前Run校验、增量事件处理及网络不确定恢复
    status: planned
    input: 当前运行合同、独立任务身份快照、依赖文件哈希、固定本机ledger及拥有任务紧凑事件
    output: dispatch envelope、一次性发送/执行许可、重复或错Run阻断、状态增量及有证据的恢复回执
    permission: local-draft-and-verify
    risk: 不发送任务或连接外部服务，不代替业务门；不得绕过accept、以重建ledger解除占用、把不确定送达当失败重发或把状态摘要当完整Skill/证据
  - id: keyword.library.version.manage
    type: manual
    purpose: 锁定一次三项用户输入、run_type和运行版本，协调ASIN代表选择、长期副任务、登录升级、汇合门、最终交付及测试专用独立验收
    status: planned
    input: 产品基础信息配置（含目标Amazon类目和多稳定类型回答）、产品配置卖点、竞品对标ASIN、run_type、Run_ID、revision、站点、规则版本和授权范围
    output: 三项输入锁、原始/入选/排除ASIN、分层锚点、Amazon联想锚点、一至两个卖家精灵种子、登录升级、机械任务身份门、阶段状态、冲突清单及适用质量状态
    permission: local-draft
    risk: 不代跑专责执行模块；正式只读运行中不修改规则；运行中不请求业务确认；网页登录需要新登录时仅主任务提示用户；production不派发独立QA且不伪造QA/P1
  - id: keyword.source.merge-and-assemble
    type: manual
    purpose: 机械合并SIF、Amazon联想和卖家精灵锁定回传并装配第一板块两Sheet工作簿
    status: planned
    input: 三来源拥有副任务正式回传的最小工作簿、manifests、哈希、状态、原始/入选/排除ASIN、用户类目细分回答、分层类目锚点、联想锚点、一至两个卖家精灵种子及唯一成功导出和SKU事实
    output: Sheet1关键词池、Sheet2任务信息与类目锚点、合并manifest和完成状态
    permission: local-draft-and-verify
    risk: 无拥有副任务正式回传或用户明确的一次性Run例外时不合并；不语义删词；不把缺值填0；Amazon联想未执行时第一板块不得完成
  - id: keyword.runtime.contract.manage
    type: cli
    purpose: 从三项输入哈希、revision、规则拥有文件和阶段依赖生成并验证内容寻址运行合同与阶段状态
    status: planned
    input: 本机Run规格、contracts/runtime-rule-map.json、权威规则文件、阶段输出/证据SHA-256和人口锁
    output: run-contract.json、stage_key、可复用结论和规则漂移失败状态
    permission: local-draft-and-verify
    risk: 运行合同只在本机忽略目录；不得包含凭据、会话、任务UUID或绝对路径；不得用规则摘要替代完整Skill/合同阅读；哈希或人口漂移不得续跑
  - id: keyword.runtime.failure-isolation.verify
    type: cli
    purpose: 按固定阶段图计算依赖就绪和失败影响范围，使无关分支继续执行而不绕过最终汇合门
    status: planned
    input: run-contract、stage status目录、来源preflight和目标阶段
    output: ready/resume判定、阻断依赖和仅下游影响清单
    permission: local-verify
    risk: 只能缩小技术阻断传播，不能把未完成阶段视为完成；assembly仍必须等待全部适用分支，production/test-validation质量路由不得改变
